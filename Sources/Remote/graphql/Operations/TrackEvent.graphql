mutation TrackEvent($anonymousId: UUID, $name: EventName!, $sourceId: ID!, $primaryData: PrimaryEventDataInput, $preview: Boolean) {
    addEvent(anonymousID: $anonymousId, name: $name, sourceID: $sourceId, primaryData: $primaryData, preview: $preview) {
        triggerInfo {
            activate
            surveyId
            activateParam {
                delay
            }
            customizationParam {
                overlay {
                    active
                    color
                    blur {
                        active
                        number
                    }
                }
            }
        }
    }
}

mutation TrackCustomEvent($anonymousId: UUID, $name: EventName!, $sourceId: ID!, $primaryData: PrimaryEventDataInput, $customName: String!, $customData: JSON, $preview: Boolean) {
    addCustomEvent(anonymousID: $anonymousId, name: $name, sourceID: $sourceId, primaryData: $primaryData, customName: $customName, customData: $customData, preview: $preview) {
        triggerInfo {
            activate
            surveyId
            activateParam {
                delay
            }
            customizationParam {
                overlay {
                    active
                    color
                    blur {
                        active
                        number
                    }
                }
            }
        }
    }
}
